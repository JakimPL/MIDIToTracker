[project]
name = "midi2tracker"
version = "2.0.0"
description = "MIDIToTracker - Convert MIDI files into FastTracker 2 tracker modules"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Jakim" }]
dependencies = [
    "mido>=1.3",
    "numpy>=2.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "audiotokenizer",
]

[project.scripts]
midi2tracker = "midi2tracker.cli:main"

[dependency-groups]
dev = [
    "black==26.5.1",
    "isort==8.0.1",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pylint==4.0.6",
    "pylint-pydantic==0.4.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "types-pyyaml>=6.0",
]

[tool.uv.sources]
audiotokenizer = { path = "../AudioTokenizer", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midi2tracker"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["midi2tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["src/midi2tracker"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
files = ["src/midi2tracker"]
exclude = ["tests"]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pylint.main]
load-plugins = ["pylint_pydantic"]
fail-under = 9.9

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "too-few-public-methods",
]
